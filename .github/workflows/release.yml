name: Release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    # A fork's pull request from a branch named main also fires workflow_run,
    # and this file runs with the repo's secrets, so only a push counts.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Decide whether this merge is a release
        id: plan
        run: |
          version=$(nix eval --raw --impure --expr '(builtins.fromJSON (builtins.readFile ./plugin/cvesmic/plugin.json)).version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" = 0.0.0 ] || gh release view "v$version" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ -f "RELEASE-NOTES/$version.md" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" >/dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::version $version has no tag, no release and no RELEASE-NOTES/$version.md"
            exit 1
          fi

      - name: Build the packages
        if: steps.plan.outputs.release == 'true'
        run: |
          nix build .#release
          ls -l result/

      # GitHub creates the tag at $SHA if it does not exist, and ignores
      # --target if it does.
      - name: Tag and announce
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          gh release create "v$VERSION" --target "$SHA" --title "v$VERSION" \
            --notes-file "RELEASE-NOTES/$VERSION.md" \
            result/*
